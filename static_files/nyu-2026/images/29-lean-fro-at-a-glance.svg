<title id="astra3-29-lean-fro-at-a-glance-title">The Lean FRO: people, mission, focus, and funders</title>
<desc id="astra3-29-lean-fro-at-a-glance-desc">Lean Focused Research Organization, a nonprofit launched in July 2023 by Leo de Moura and Sebastian Ullrich. Twenty people, open source. Its three focus areas are Trust, Scalability and Understanding. The seven funder names reproduce the slide, without amounts or rankings.</desc>
