<title>From a set-theoretic model to an x86 checker: proofs and remaining trust</title>
<desc>Upward arrows are proved refinement or consistency implications. The con-ron Rust implementation and con-agua low-level language both connect to con-ron’s Lean twin. The right column names residual assumptions and execution components rather than claiming the entire system is verified.</desc>
