<svg viewBox="0 0 1600 590" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title>Statements and specifications: human responsibility and Lean’s guarantee</title>
  <desc>People are responsible for matching the formal statement to human intent. AI writes a proof, and Lean’s kernel checks the proof against that statement. StacksCore has been reviewed by people; StacksFrontier has not yet been reviewed, although Lean checks both. Kraken proves memory safety assuming the caller follows the decoder’s API protocol.</desc>
  <!-- Source: Slides.lean, slide 26; sources/stacks.md; sources/ai-software-verification.md, Kraken -->
