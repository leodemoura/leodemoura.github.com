  <text x="848" y="371" font-size="32" fill="#0f172a" font-weight="600" text-anchor="start">Kraken</text>
  <text x="848" y="416" font-size="28" fill="#0f172a" font-weight="400" text-anchor="start">FFmpeg SBR decoder</text>
