<svg viewBox="0 0 1600 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modular-title modular-desc" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title id="modular-title">Modular checking: replace one monolithic export with parallel module checks</title>
  <desc id="modular-desc">Today the whole development flows through one monolithic JSON export, comparator, and the checkers. CFSG has 208.3 GB of oleans; this is not the size of the JSON export. Axiom says single-threaded checking would require weeks or more. The proposed con-leche design reads and checks individual .olean modules in parallel, then composes the results into one global consistency proof. The tile grid is schematic, not a measured module count. Status: in progress.</desc>
  <!-- Source: Slides.lean, con-leche as the Official Kernel and frontier build sizes; sources/con-leche.md, PR 13. -->
  <defs>
    <marker id="modular-arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#0073A3"/></marker>
    <marker id="modular-arrow-muted" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#64748b"/></marker>
    <marker id="modular-arrow-greenline" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#059669"/></marker>
  </defs>
  <text x="24" y="46" font-size="34" fill="#0f172a" font-weight="600" text-anchor="start" data-bound="24 8 144 50">Today</text>
  <text x="200" y="46" font-size="30" fill="#0f172a" font-weight="600" text-anchor="start" data-bound="200 12 1376 46">One export of the whole development</text>
  <!-- One continuous, thick export pipe. The artifact-size annotation belongs to the oleans. -->
  <path d="M 24 86 H 1136 L 1200 150 L 1136 214 H 24 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="135" font-size="32" fill="#0f172a" font-weight="600" text-anchor="start" data-bound="56 104 550 96">Whole development</text>
  <text x="56" y="180" font-size="28" fill="#64748b" font-weight="400" text-anchor="start" data-bound="56 104 550 96">CFSG: 208.3 GB of oleans</text>
  <text x="726" y="135" font-size="32" fill="#0f172a" font-weight="600" text-anchor="start" data-bound="726 104 398 96">One JSON file</text>
  <text x="726" y="180" font-size="28" fill="#64748b" font-weight="400" text-anchor="start" data-bound="726 104 398 96">via comparator</text>
  <path d="M 1200 150 H 1240" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#modular-arrow-muted)"/>
  <rect x="1240" y="86" width="336" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1408" y="138" font-size="30" fill="#0f172a" font-weight="600" text-anchor="middle" data-bound="1260 104 296 92">Checkers</text>
  <text x="1408" y="180" font-size="26" fill="#64748b" font-weight="400" text-anchor="middle" data-bound="1260 104 296 92">whole export at once</text>
  <text x="24" y="266" font-size="30" fill="#64748b" font-weight="400" text-anchor="start" data-bound="24 230 1552 48">Axiom: single-threaded checking “would require weeks or more”.</text>
  <path d="M 24 300 H 1576" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="350" font-size="34" fill="#0073A3" font-weight="600" text-anchor="start" data-bound="24 312 144 50">Next</text>
  <text x="200" y="350" font-size="30" fill="#0f172a" font-weight="600" text-anchor="start" data-bound="200 316 810 46">Check modules in parallel</text>
  <text x="1576" y="350" font-size="26" fill="#64748b" font-weight="400" text-anchor="end" data-bound="1150 320 426 42">In progress</text>
  <text x="24" y="401" font-size="26" fill="#0f172a" font-weight="400" text-anchor="start" data-bound="24 370 488 40">Each tile: one .olean module</text>
