<svg viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title>lean-raw bypasses surface elaboration and constructs Expr directly</title>
  <desc>The surface pipeline parses syntax, expands macros and elaborates terms before the kernel checks Expr. lean-raw uses a hand-written parser to produce Expr directly. Holes reconnect to normal elaboration.</desc>
