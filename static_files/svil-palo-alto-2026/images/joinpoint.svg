<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title>vcgen join points: duplicated continuations versus shared proofs</title>
  <desc>Three consecutive if/else splits unfold to eight copies of the rest of the program without +jp. With +jp, each split has one shared continuation, proved once under the disjunction of the incoming branch facts.</desc>
