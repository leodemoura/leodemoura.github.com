<svg viewBox="0 0 1600 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"><title>Lean validation, 2026: found, fixed, checked independently. No Mathlib or CSLib proof was affected.</title>
