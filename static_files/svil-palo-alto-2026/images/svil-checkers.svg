<svg viewBox="0 0 1600 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif"><title>con-leche, con-ron, and con-agua: verified proof checkers written by Claude</title>
