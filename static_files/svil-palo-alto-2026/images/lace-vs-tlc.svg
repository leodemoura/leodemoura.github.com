<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 1600 790" role="img" aria-label="Lace versus TLC wall-clock speedup by benchmark" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <desc>Minimum and maximum TLC-to-Lace wall-clock time ratios across 1–14 worker threads, sorted by maximum speedup. Horizontal positions use a logarithmic scale. MultiPaxos, Paxos, and NOPaxos are highlighted in blue.</desc>
  <rect width="1600" height="840" fill="#ffffff"/>
  <!-- Logarithmic mapping: x = 330 + 700 * log10(speedup). -->
  <g id="grid" stroke="#e2e8f0" stroke-width="1.5">
    <line x1="540.721" y1="42" x2="540.721" y2="704"/>
    <line x1="819.279" y1="42" x2="819.279" y2="704"/>
    <line x1="1030.000" y1="42" x2="1030.000" y2="704"/>
    <line x1="1240.721" y1="42" x2="1240.721" y2="704"/>
  </g>
  <line x1="330" y1="42" x2="330" y2="704" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="30" text-anchor="middle" font-size="22" fill="#64748b">TLC</text>
  <g id="benchmarks" font-size="24">
    <g data-benchmark="MultiPaxos" data-min="11.4" data-max="21.6" transform="translate(0 62)">
