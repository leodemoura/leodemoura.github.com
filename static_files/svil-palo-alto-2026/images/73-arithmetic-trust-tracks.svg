<title id="astra3-73-arithmetic-trust-tracks-title">Verified Arithmetic and Fast Kernel Reduction</title>
<desc id="astra3-73-arithmetic-trust-tracks-desc">Three separate work tracks. The current official checker trusts the C++ kernel and GMP arithmetic, plus its execution environment. Verified Lean bignums would replace GMP; boost accelerates selected reduction functions in con-leche; a designed certificate language targets checking speed inside the kernel. Each track has its own maturity label. The instruction comparison is one grind benchmark in con-leche.</desc>
