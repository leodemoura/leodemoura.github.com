<text x="32" y="44" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start" data-region="32,10,1500,45.900000000000006">Stacks in Lean: two review tiers</text>
<text x="32" y="83" font-size="25" font-weight="400" fill="#64748b" text-anchor="start" data-region="32,58,1500,33.75">Stacks in Lean · 15.8M lines · 663,090 declarations · November 4, 2026</text>
<text x="32" y="131" font-size="28" font-weight="600" fill="#0f172a" text-anchor="start" data-region="32,103,340,37.800000000000004">Source text</text>
