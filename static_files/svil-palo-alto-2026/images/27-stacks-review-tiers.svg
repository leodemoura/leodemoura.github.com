<svg viewBox="0 0 1600 650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
<title>Stacks: source correspondence and formal validity are separate checks</title>
<desc>StacksFrontier is AI-written and awaits human review against the Stacks Project. StacksCore has that human review and meets Mathlib standards. Lean checks every proof in both tiers. The equal-sized tracks are categorical and do not encode the amounts of code in each tier.</desc>
