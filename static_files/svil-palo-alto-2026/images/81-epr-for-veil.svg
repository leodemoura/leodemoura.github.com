<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="astra3-81-epr-for-veil-title astra3-81-epr-for-veil-desc" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
<title id="astra3-81-epr-for-veil-title">EPR for Veil: finite encoding, SAT, and model-based instantiation</title>
<desc id="astra3-81-epr-for-veil-desc">Prototype by Henrik Böving, October 30. Veil verification goals, most in EPR, become a many-sorted EPR problem, then a finite bit-vector encoding and SAT. A candidate model is checked against quantifiers; a violating instance refines the encoding. A valid model yields a counterexample. UNSAT leads toward a proof, with prototype proof reconstruction unconfirmed. The card example instantiates the universal hypothesis at c; c equals a or b, and either case contradicts a predicate disequality.</desc>
