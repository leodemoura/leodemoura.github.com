<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title>Eager import versus lazy access to memory-mapped module data</title>
  <desc>Eager import merges every module’s constants, simp sets and instances into in-memory tables at startup. Lazy import keeps per-module data in memory-mapped .olean files and builds tables on first access. Only touched entries are highlighted. Prefix trees have shipped; lazy import is in progress. For import Lean, simp set instructions fall from 191M to 11M and instance instructions from 90M to 6M.</desc>
