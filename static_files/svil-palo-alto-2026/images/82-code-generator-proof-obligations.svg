<title id="astra3-82-code-generator-proof-obligations-title">A New Code Generator: semantics and a correctness obligation at every pass</title>
<desc id="astra3-82-code-generator-proof-obligations-desc">Today: Lean programs pass through an optimizing compiler to executable code. Planned: each intermediate language has a semantics, and each compiler pass has an explicit obligation to preserve the specified behavior. The diagram is schematic and contains no private intermediate-language or backend names. Public design priorities are stack-allocated objects, recursive join points, uniqueness annotations and better support for array programs. Design now; implementation from early 2027.</desc>
