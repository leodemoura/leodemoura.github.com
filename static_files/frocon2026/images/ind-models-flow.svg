<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" role="img" font-family="Source Sans 3, sans-serif" font-size="14">
  <rect data-bg="1" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <g font-weight="600" fill="#0f172a">
    <rect x="20" y="60" width="180" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="110" y="88" text-anchor="middle">lean4export</text><text x="110" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">NDJSON, user inductives</text>
    <rect x="250" y="30" width="420" height="130" rx="9" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="460" y="56" text-anchor="middle">lean-inductive-models</text>
      <text x="460" y="80" text-anchor="middle" font-size="13" font-weight="400">for each inductive type: generate definitions and theorems</text>
      <text x="460" y="98" text-anchor="middle" font-size="13" font-weight="400">for the type former, constructors, recursor, projections</text>
      <text x="460" y="120" text-anchor="middle" font-size="13" font-weight="400">from the basis  Eq · Nat · PUnit · PSigma' · Quot</text>
      <text x="460" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#0369a1">11 construction routes (storage, Church encodings, well-founded trees, ...)</text>
    <rect x="720" y="60" width="200" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="820" y="88" text-anchor="middle">NDJSON out</text><text x="820" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">original decls + models</text>
    <rect x="970" y="52" width="210" height="86" rx="9" fill="#0073A3"/>
      <text x="1075" y="80" text-anchor="middle" fill="#fff">official kernel</text>
      <text x="1075" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#cfe8f5">checks that every generated</text>
      <text x="1075" y="116" text-anchor="middle" font-size="12" font-weight="400" fill="#cfe8f5">definition inhabits its type</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 95 L 248 95"/><path d="M670 95 L 718 95"/><path d="M920 95 L 968 95"/>
  </g>
  <rect x="250" y="190" width="420" height="60" rx="9" fill="#fff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="460" y="214" text-anchor="middle" font-size="13" font-weight="600">structural check</text>
  <text x="460" y="234" text-anchor="middle" font-size="12.5">names, universe arities, declaration types compared literally with the export</text>
  <path d="M460 160 L 460 188" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <g font-size="13.5" fill="#0f172a">
    <text x="20" y="290">Translation validation: each inductive type in the input is modelled from first principles, and the model is checked. Not a general soundness proof.</text>
    <text x="20" y="312">"This catches a large class of potential implementation bugs in the kernel's handling of inductives." (postmortem, Aug 24). Motivated by #14576.</text>
    <text x="20" y="334">In the Arena as ind-models: 67 rejects, 0 false accepts, 4 declines; Mathlib 31.6 min (official: 32.9 min). Rejected all four kernel-logic exploits of Aug 2026.</text>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="20" y="368">github.com/nomeata/lean-inductive-models, created Aug 11, 2026. Joachim Breitner; constructions generated by Claude and Codex. con-leche used it as a preprocessor during development.</text>
    <text x="20" y="388">Basis and route count from the repository README; test results from arena.lean-lang.org (2026-09-22).</text>
  </g>
</svg>
