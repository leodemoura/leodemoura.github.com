<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" role="img" font-family="Source Sans 3, sans-serif" font-size="14">
  <rect data-bg="1" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <!-- left: lake build -->
  <rect x="20" y="20" width="560" height="440" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="300" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">lake build  (blue check marks)</text>
  <text x="300" y="72" text-anchor="middle" font-size="12.5" fill="#991b1b" font-style="italic">everything that executes can influence the result</text>
  <g font-size="14" fill="#0f172a">
    <rect x="40" y="90"  width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="112">the statement, and every imported file that can change its meaning</text>
    <rect x="40" y="132" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="154">parser, macro system, elaborator</text>
    <rect x="40" y="174" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="196">tactics and metaprograms, including third-party ones</text>
    <rect x="40" y="216" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="238">Lean compiler (implemented_by, extern, decide +native)</text>
    <rect x="40" y="258" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="280">official kernel: src/kernel, 7,556 lines of C++</text>
    <rect x="40" y="300" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="322">Lean runtime: reference counting, GMP, memory management</text>
    <rect x="40" y="342" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="364">.olean files as written by the build</text>
    <rect x="40" y="384" width="520" height="34" rx="7" fill="#fff" stroke="#fca5a5"/><text x="56" y="406">OS, hardware</text>
  </g>
  <text x="40" y="446" font-size="12.5" fill="#991b1b">All 2026 soundness exploits were accepted by the official kernel at this level.</text>

  <!-- right: comparator + verified checkers -->
  <rect x="620" y="20" width="560" height="440" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="900" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#064e3b">comparator + con-leche + con-ron</text>
  <text x="900" y="72" text-anchor="middle" font-size="12.5" fill="#047857" font-style="italic">Reference Manual level IV, with verified checkers</text>
  <g font-size="14" fill="#0f172a">
    <rect x="640" y="90"  width="520" height="34" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="112">the challenge statement (minimal imports) and its elaboration</text>
    <rect x="640" y="132" width="520" height="34" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="154">comparator: 1,065 lines of Lean</text>
    <rect x="640" y="174" width="520" height="48" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="194">con-leche: theorem model_exists (MainTheorem.lean, 124 lines),</text><text x="656" y="212">checked by Lean's kernel; runs on Lean compiler + runtime + GMP</text>
    <rect x="640" y="230" width="520" height="48" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="250">con-ron: the same theorem via the Aeneas refinement proof;</text><text x="656" y="268">runs on rustc + Rust runtime. Trusted: Aeneas.</text>
    <rect x="640" y="286" width="520" height="34" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="308">export format validation, lean4export</text>
    <rect x="640" y="328" width="520" height="34" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="350">sandbox (bubblewrap), OS, hardware</text>
    <rect x="640" y="370" width="520" height="34" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="656" y="392">assumed consistent: ZF (no infinity, no choice) + ω Grothendieck universes</text>
  </g>
  <g font-size="12.5" fill="#065f46">
    <text x="640" y="426">Not trusted any more: elaborator, tactics, metaprograms, compiler, the C++ kernel, the .olean files.</text>
    <text x="640" y="446">Proofs using decide +native or implemented_by cannot be checked this way.</text>
  </g>
  <text x="20" y="488" font-size="12.5" fill="#475569">Line counts: github.com/leanprover/{lean4,comparator,con-leche}, 2026-09-22. Levels: Lean Reference Manual, "Validating a Lean Proof".</text>
</svg>
